# Membangun dan menjalankan maindulu sebagai web statis dalam satu container.
#   Dari akar repo:  docker compose -f deploy/docker-compose.yml up --build
#   Dari deploy/:    docker compose up --build
# Porta host lain:
#   MAIN_DULU_PORT=8888 docker compose -f deploy/docker-compose.yml up --build
name: maindulu

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: maindulu-web:latest
    container_name: maindulu-web
    ports:
      - "${MAIN_DULU_PORT:-7777}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
