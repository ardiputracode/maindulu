# Konfigurasi Nginx di dalam container; dicopy oleh deploy/Dockerfile ke
# /etc/nginx/conf.d/default.conf. Perilakunya selaras dengan deploy/nginx.conf:
# folder aset mengembalikan 404 nyata untuk berkas yang hilang (player menolak
# tanggapan HTML lewat checkServerAsset), dan hanya halaman SPA yang di-fallback
# ke index.html.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;

    # Kompresi teks agar aset besar terasa cepat di LAN; image/wasm biner lain
    # dibiarkan apa adanya (default_type application/octet-stream).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    # Aset engine/player/katalog/konten: hanya berkas nyata, tanpa fallback HTML.
    location ~ ^/(vendor|player|catalog|games|bios|covers|assets)/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Halaman: route klien (mis. /main, /pengaturan) di-fallback ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
