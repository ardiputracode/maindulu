# Folder yang SAMA untuk scan, upload, dan hapus di maindulu/RomM.
# PERHATIAN: penghapusan maindulu menghapus file fisik yang dipakai RomM.
# docker compose --env-file .env.backend -f deploy/docker-compose.backend.yml -f deploy/docker-compose.shared.yml up -d --build
services:
  backend:
    environment:
      - MAIN_DULU_EXTERNAL_ROM_DIR=/mnt/romm/roms
      - MAIN_DULU_EXTERNAL_BIOS_DIR=/mnt/romm/bios
      - MAIN_DULU_EXTERNAL_WRITABLE=true
    volumes:
      - type: bind
        source: "${MAIN_DULU_ROM_PATH:?Isi MAIN_DULU_ROM_PATH dengan folder ROM host}"
        target: /mnt/romm/roms
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: "${MAIN_DULU_BIOS_PATH:?Isi MAIN_DULU_BIOS_PATH dengan folder BIOS host}"
        target: /mnt/romm/bios
        read_only: false
        bind:
          create_host_path: false
